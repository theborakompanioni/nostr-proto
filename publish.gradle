apply plugin: 'signing'
apply plugin: 'com.netflix.nebula.maven-publish'
apply plugin: 'com.netflix.nebula.publish-verification'

signing {
    // https://docs.gradle.org/current/userguide/signing_plugin.html#sec:signatory_credentials
    sign publishing.publications.nebula
}

// Resolve the flag at configuration time: accessing `project` from an `onlyIf` predicate
// breaks the configuration cache (and thus release builds, which run without --no-configuration-cache).
def signingEnabled = project.hasProperty('signing.password')

tasks.withType(Sign).configureEach {
    onlyIf { signingEnabled }
}

// The nebula publish-verification plugin captures project state in pom generation.
// Publishing is an explicit, infrequent operation, so opt out of the configuration cache for it.
tasks.withType(org.gradle.api.publish.maven.tasks.GenerateMavenPom).configureEach {
    notCompatibleWithConfigurationCache('nebula publish-verification plugin is not configuration-cache compatible')
}

publishing {
    publications {
        nebula(MavenPublication) { publication ->
            pom {
                packaging = 'jar'
                licenses {
                    license {
                        name = 'The Apache Software License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
            }
            sourcesJar
            javadocJar
        }
    }

    repositories {
        maven {
            // creates a task `publishNebulaPublicationToStagingDeployRepository`
            it.name = 'StagingDeploy'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}
