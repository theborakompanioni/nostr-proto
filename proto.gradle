apply plugin: 'com.google.protobuf'

sourceSets {
    main {
        proto {
            // In addition to the default 'src/main/proto'
            srcDir file('src/main/java')
        }
        java {
            srcDir new File("${layout.buildDirectory}", '/generated/sources/proto/main/java')
            srcDir new File("${layout.buildDirectory}", '/generated/sources/proto/main/grpc')
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        dependencySubstitution {
            substitute module("com.google.protobuf:protobuf-javalite") using module("com.google.protobuf:protobuf-java:${libs.versions.protobuf.get()}")
        }
    }
}

dependencies {
    api libs.protobuf.java
    implementation libs.protobuf.java.util
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.get()}" }

    plugins {
        grpc { artifact = "io.grpc:protoc-gen-grpc-java:${libs.versions.grpc.get()}" }
    }

    generateProtoTasks {
        all().configureEach { task ->
            task.plugins{ grpc {} }
        }
    }
}
