plugins {
    id 'java'
}

description = 'nostr proto json package'

dependencies {
    api project(':nostr-proto')

    implementation libs.jackson.jr.all

    testImplementation (libs.nostr.core) {
        exclude group: 'io.github.theborakompanioni', module: 'nostr-proto'
        exclude group: 'io.github.theborakompanioni', module: 'nostr-proto-json'
    }
    testImplementation (libs.nostr.identity) {
        exclude group: 'io.github.theborakompanioni', module: 'nostr-proto'
        exclude group: 'io.github.theborakompanioni', module: 'nostr-proto-json'
    }
}
