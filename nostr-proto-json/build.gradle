plugins {
    id 'java'
}

description = 'nostr proto json package'

dependencies {
    api project(':nostr-proto')

    implementation "tools.jackson.jr:jackson-jr-all:${rootProject.ext.jacksonJr3Version}"

    testImplementation ("io.github.theborakompanioni:nostr-core:${rootProject.ext.nostrSpringBootStarterVersion}") {
        exclude group: 'io.github.theborakompanioni', module: 'nostr-proto'
        exclude group: 'io.github.theborakompanioni', module: 'nostr-proto-json'
    }
    testImplementation ("io.github.theborakompanioni:nostr-identity:${rootProject.ext.nostrSpringBootStarterVersion}") {
        exclude group: 'io.github.theborakompanioni', module: 'nostr-proto'
        exclude group: 'io.github.theborakompanioni', module: 'nostr-proto-json'
    }
}
