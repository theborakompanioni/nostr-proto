[versions]
checkstyle = "14.4.0"
findsecbugs = "1.14.0"
grpc = "1.85.1"
jackson = "3.3.0"
nostr = "0.6.0"
protobuf = "4.36.2"
protobufGradle = "0.10.0"
springBoot = "4.1.2"

[libraries]
findsecbugs-plugin = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }
grpc-protoc-gen-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-jr-all = { module = "tools.jackson.jr:jackson-jr-all", version.ref = "jackson" }
nostr-core = { module = "io.github.theborakompanioni:nostr-core", version.ref = "nostr" }
nostr-identity = { module = "io.github.theborakompanioni:nostr-identity", version.ref = "nostr" }
protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobufGradle" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }

[plugins]
jreleaser = { id = "org.jreleaser", version = "1.27.0" }
nebula-facet = { id = "com.netflix.nebula.facet", version = "13.1.2" }
nebula-lint = { id = "nebula.lint", version = "21.4.1" }
nebula-project = { id = "com.netflix.nebula.project", version = "13.1.2" }
nebula-release = { id = "nebula.release", version = "21.1.4" }
spotbugs = { id = "com.github.spotbugs", version = "6.5.13" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
